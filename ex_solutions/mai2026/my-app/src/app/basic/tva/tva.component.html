<div class="fondVert">
    <p>calcul de tva</p>
    ht : <input type="number" [(ngModel)]="ht"  > <br/>
    taux : <select [(ngModel)]="taux" >
        @for(t of tauxPossibles; track t){
              <option [ngValue]="t">{{t}}%</option>
        }
        </select><br/>
    tva={{tva() | toFixed:2}} <br/>
    ttc={{ttc() | toFixed:2}} <br/>
</div>
